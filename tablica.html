<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablica Ogłoszeń - Pielęgniarstwo</title>
    <link rel="stylesheet" href="style-tablica.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>
    <!-- Nagłówek spójny z rozkładem zajęć -->
    <div class="header">
        <div class="header-left">
            <h1>Tablica Ogłoszeń</h1>
        </div>
        <div class="header-right">
            <a href="index.html" class="btn" style="text-decoration: none;"><b style="color: #E88F80;">Wróć do Rozkładu</b></a>
            <a href="https://drive.google.com/drive/folders/17hcbBf1VTO6uPfgbIGTTr9YRs79VqgxO?usp=sharing" class="btn" style="text-decoration: none;"><b style="color: #8CEDB5;">Link do dysku</b></a>
        </div>
    </div>

    <main class="container">
        <!-- Sekcja dodawania ogłoszeń -->
<!-- Sekcja dodawania ogłoszeń -->
        <section class="add-post-section">
            <details id="addPostDetails">
                <summary class="toggle-form-btn"><b> Kliknij, aby dodać nowe ogłoszenie</b></summary>
                
                <div class="form-container">
                    <form id="postForm">
                        <input type="text" id="title" placeholder="Tytuł ogłoszenia" required>
                        <textarea id="content" placeholder="Treść ogłoszenia..." required></textarea>
                        
                        <label>Data wydarzenia / ogłoszenia</label>
                        <input type="date" id="dataWydarzenia">

                        <div class="form-row">
                            <label class="checkbox-label urgent-label">
                                <input type="checkbox" id="isUrgent"> Oznacz jako PILNE
                            </label>
                        </div>
                        
                        <div class="form-row" style="width: 100%;">
                            <input type="url" id="fileLink" placeholder="Link do załącznika" style="width: 100%; background: var(--bg-main);">
                        </div>

                        <input type="password" id="pinCode" placeholder="Podaj 6-cyfrowy PIN" required pattern="[0-9]{6}">
                        
                        <button type="submit" class="btn-primary">Opublikuj</button>
                    </form>
                </div>
            </details>
        </section>

        <!-- Główny widok (Tablica + Kalendarz) -->
        <div class="dashboard">
            <section class="board-section">
                <h2>Tablica</h2>
                <div id="postsContainer" class="posts-grid">
                    <p class="loading">Ładowanie ogłoszeń z chmury...</p>
                </div>
            </section>

            <section class="calendar-section">
                <h2>Kalendarz</h2>
                <div id="calendar"></div>
            </section>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
